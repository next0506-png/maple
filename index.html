<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>단풍숲 모험</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f08a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="단풍숲 모험">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fdf3dc; --panel:#fff9e8; --panel2:#f6e6bd; --ink:#3b2a1a; --ink2:#7d654a;
  --line:#dcc18c; --shadow:#c9a76a; --wood:#8a5a32; --wood2:#6e4524; --accent:#f08a24; --accent-d:#b8610f;
  --good:#3f9d4a; --bad:#d9482f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1824; --panel:#2a2335; --panel2:#372e45; --ink:#f6ead6; --ink2:#bba98e; --line:#4f4263; --shadow:#0f0c16; --wood:#5b3d24; --wood2:#42291a;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1824; --panel:#2a2335; --panel2:#372e45; --ink:#f6ead6; --ink2:#bba98e; --line:#4f4263; --shadow:#0f0c16; --wood:#5b3d24; --wood2:#42291a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none}
h1,h2,h3,button,.jua{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:400}
[hidden]{display:none!important}
#app{height:100%;max-width:980px;margin:0 auto;position:relative}
.screen{height:100%;display:flex;flex-direction:column}
button{cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,textarea{-webkit-user-select:text;user-select:text}

.btn{font-size:15px;background:var(--accent);color:#fff;border:0;border-bottom:4px solid var(--accent-d);border-radius:11px;padding:8px 13px;line-height:1.1}
.btn:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.btn.ghost{background:var(--panel2);color:var(--ink);border-bottom-color:var(--line)}
.btn.good{background:var(--good);border-bottom-color:#2a6f33}
.btn.bad{background:var(--bad);border-bottom-color:#9a2e1c}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.off{opacity:.45}
.mut{color:var(--ink2);font-size:13px;margin:4px 0 0;line-height:1.45}

/* login */
#login{align-items:center;justify-content:flex-start;padding:20px;background:linear-gradient(#8fd2ff,#dff4ff 55%,#a6dc7a 55.1%,#6cc24a);position:relative;overflow:auto}
#login .lcard{margin:auto 0;width:100%;max-width:340px;background:var(--panel);border:3px solid var(--wood);border-radius:20px;padding:18px;box-shadow:0 6px 0 var(--shadow);position:relative;z-index:2}
#login h1{margin:0 0 2px;font-size:32px;color:var(--accent);text-shadow:2px 2px 0 var(--panel2)}
#login .sub{margin:0 0 14px;color:var(--ink2)}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:13px;color:var(--ink2);margin-bottom:3px}
.field input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.field input:focus{outline:none;border-color:var(--accent)}
.lrow{display:flex;gap:8px;margin-top:6px}
.lrow .btn{flex:1;padding:11px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink2);margin:4px 0 8px}
#loginMsg{min-height:20px;margin:8px 0 0;font-size:14px;color:var(--bad)}

/* stage */
#stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:3px;pointer-events:none;width:150px}
.hud .nm{font-family:'Jua',sans-serif;color:#fff;font-size:14px;text-shadow:0 1px 3px #000,0 0 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:13px;border-radius:7px;background:rgba(0,0,0,.55);overflow:hidden;border:1px solid rgba(255,255,255,.25)}
.bar i{position:absolute;inset:0 auto 0 0;width:100%}
.bar span{position:absolute;inset:0;text-align:center;font:11px/13px 'Jua',sans-serif;color:#fff;text-shadow:0 1px 1px #000}
#hpF{background:linear-gradient(#ff8a8a,#e64545)}
#xpBar{position:absolute;left:0;right:0;bottom:0;height:7px;background:rgba(0,0,0,.5)}
#xpBar i{display:block;height:100%;width:0;background:linear-gradient(#9fe8ff,#3aa9e6)}
#mapName{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:rgba(0,0,0,.5);color:#fff;font:13px 'Jua',sans-serif;padding:3px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
#menuBtns{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:5px}
#menuBtns button{width:38px;height:38px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:rgba(30,20,10,.6);font-size:18px;color:#fff;padding:0;position:relative}
#menuBtns button .badge{position:absolute;right:-4px;top:-4px;min-width:16px;height:16px;border-radius:8px;background:#e64545;font:11px/16px 'Jua',sans-serif;text-align:center;padding:0 3px}
#bossHud{position:absolute;left:50%;top:34px;transform:translateX(-50%);width:min(60%,320px);pointer-events:none;text-align:center}
#bossHud b{font:14px 'Jua',sans-serif;color:#fff;text-shadow:0 1px 3px #000}
#bossHud .bar i{background:linear-gradient(#ffb36a,#e0482f)}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font:26px 'Jua',sans-serif;color:#fff;text-shadow:0 2px 0 #7a3a00,0 0 8px #000;pointer-events:none;opacity:0;transition:opacity .4s;padding:0 12px}
#banner.on{opacity:1}
#chatlog{position:absolute;left:8px;top:84px;width:min(62%,300px);display:flex;flex-direction:column;gap:2px;pointer-events:none}
#chatlog div{background:rgba(0,0,0,.45);color:#fff;font-size:12.5px;line-height:1.3;padding:2px 8px;border-radius:8px;align-self:flex-start;max-width:100%;word-break:break-all}
#chatlog .sys{color:#ffe79a}
#timer{position:absolute;right:52px;top:10px;font:15px 'Jua',sans-serif;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
#hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:13px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}

#chatbar{flex:none;display:flex;gap:6px;padding:6px 8px;background:var(--wood2)}
#chatbar input{flex:1;min-width:0;font:inherit;font-size:16px;padding:7px 10px;border-radius:10px;border:0;background:var(--panel);color:var(--ink)}
#chatbar button{padding:6px 10px;font-size:18px;background:var(--panel2);border:0;border-radius:10px}

/* pad */
#pad{flex:none;height:158px;background:var(--wood);border-top:4px solid var(--wood2);display:flex;justify-content:space-between;align-items:center;padding:6px 10px;touch-action:none;gap:6px}
.grp{display:grid;gap:7px;justify-items:center;align-items:center}
.dpad{grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,50px)}
.act{grid-template-columns:repeat(4,42px);grid-template-rows:42px 62px}
.pb{position:relative;width:100%;height:100%;border-radius:50%;border:3px solid rgba(255,255,255,.4);background:rgba(20,10,0,.45);color:#fff;font-size:22px;padding:0;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.pb small{font:10px 'Jua',sans-serif;opacity:.9;margin-top:1px}
.pb.on{background:rgba(255,255,255,.35)}
.pb .cd{position:absolute;left:0;right:0;bottom:0;height:calc(var(--cd,0)*100%);background:rgba(0,0,0,.6)}
.pb.big{border-radius:50%;font-size:24px}
.pb .cnt{position:absolute;right:3px;top:1px;font:11px 'Jua',sans-serif}
#bS1{grid-column:3}
#bAtk{grid-column:3/5;background:rgba(240,138,36,.8)}
#bJump{grid-column:1/3;background:rgba(70,150,230,.7)}
#bAtk,#bJump{border-radius:40px}

/* modal / toast */
#modal{position:fixed;inset:0;background:rgba(20,10,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mcard{width:100%;max-width:420px;background:var(--panel);border:3px solid var(--wood);border-radius:18px;padding:14px;box-shadow:0 6px 0 var(--shadow);max-height:88%;overflow:auto;position:relative}
.mcard h2{margin:0 0 6px;font-size:21px;padding-right:34px}
.mcard h3{margin:10px 0 4px;font-size:16px}
.mcard .x{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;border:0;background:var(--panel2);font-size:16px;padding:0}
.mcard p{margin:6px 0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(30,18,6,.92);color:#fff;font-family:'Jua',sans-serif;padding:8px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:92%;text-align:center;pointer-events:none}
.it{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.it:first-of-type{border-top:0}
.it .ico{width:38px;height:38px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;border:2px solid var(--rc,var(--line))}
.it .tx{flex:1;min-width:0}
.it .tx b{font-family:'Jua',sans-serif;font-weight:400;font-size:15px;color:var(--rc,var(--ink));display:block}
.it .tx small{display:block;color:var(--ink2);font-size:12.5px;line-height:1.35}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--ink2)}
.kv div:nth-child(even){font-family:'Jua',sans-serif;text-align:right}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px 6px;color:var(--ink);text-align:center}
.pick button.sel{border-color:var(--accent);background:var(--panel)}
.pick button b{display:block;font-size:26px;font-weight:400}
.pick button small{display:block;font-family:'Gowun Dodum',sans-serif;color:var(--ink2);font-size:12px;margin-top:2px}
.hairs{display:flex;gap:8px;margin:6px 0}
.hairs button{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);padding:0}
.hairs button.sel{border-color:var(--ink)}
textarea{width:100%;font:12px/1.4 monospace;min-height:70px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:8px;resize:vertical}
.tag{font-family:'Jua',sans-serif;font-size:12px;background:var(--panel2);padding:3px 8px;border-radius:999px}
@media (max-height:520px){ #menuBtns{flex-direction:row;flex-wrap:wrap;width:88px;justify-content:flex-end} #menuBtns button{width:34px;height:34px;font-size:16px} #pad{height:128px} .dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px)} .act{grid-template-columns:repeat(4,40px);grid-template-rows:40px 56px} }

/* inventory */
.mcard.invcard{max-width:780px;padding:0;background:linear-gradient(#2b3d5a,#17243b);border:3px solid #0c1424;border-radius:14px;color:#fff;overflow:auto}
.invcard .x{right:8px;top:6px;background:transparent;color:#fff;font-size:20px;width:34px;height:34px}
.invt{text-align:center;font:17px 'Jua',sans-serif;color:#ffcf3a;letter-spacing:.5px;padding:9px 40px 6px;background:linear-gradient(#10192b,#1d2c47);border-bottom:2px solid #0c1424}
.invtabs{display:flex;gap:4px;padding:8px 10px 0}
.invtabs b{font:15px 'Jua',sans-serif;padding:5px 16px;border-radius:9px 9px 0 0;background:#34476a;color:#c8d4ea}
.invtabs b.on{background:linear-gradient(#ffb43a,#f08a24);color:#fff}
.invbody{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:10px;padding:10px;background:#1b2a45;border-top:2px solid #0c1424}
@media (max-width:640px){.invbody{grid-template-columns:1fr}.invright{order:-1}.igrid{grid-template-columns:repeat(6,1fr)}}
.invleft,.invright{background:#eef1f6;border-radius:10px;padding:8px;color:#1b2a45;min-width:0}
.invsec{font:12.5px 'Jua',sans-serif;color:#fff;background:linear-gradient(#27508c,#1a3a6a);padding:4px 10px;border-radius:5px;margin-bottom:6px;letter-spacing:.3px}
.eqwrap{display:grid;grid-template-columns:52px 1fr 52px;gap:6px;align-items:start;margin-bottom:8px}
.eqcol{display:flex;flex-direction:column;gap:6px}
.eqs{width:52px;height:52px;border-radius:8px;background:linear-gradient(#e4e8ef,#cfd6e2);border:2px solid #b8c1d1;display:flex;flex-direction:column;align-items:center;justify-content:center;font:10px 'Jua',sans-serif;color:#8a94a8;line-height:1.1;text-align:center;padding:0}
.eqs.dis{opacity:.7}
.eqs.act{border-color:#f08a24;background:linear-gradient(#fff4dc,#ffe0a8);color:#7a4a10;cursor:pointer}
.eqs.sel{box-shadow:0 0 0 3px #f08a24}
.eqs b{font-size:24px;font-weight:400;line-height:1}
.eqchar{text-align:center;position:relative}
.eqchar canvas{display:block;margin:0 auto;width:100%;max-width:150px;height:auto}
.lvtag,.jobtag{font:13px 'Jua',sans-serif;border-radius:6px;padding:2px 6px;margin:2px auto;max-width:130px}
.lvtag{background:#5b6e8a;color:#ffd75a}
.jobtag{background:#5b6e8a;color:#fff}
.srow{display:flex;align-items:center;gap:6px;margin-bottom:5px;font:13.5px 'Jua',sans-serif}
.srow .lb{min-width:62px;text-align:center;padding:3px 6px;border-radius:5px;color:#fff}
.lb.o{background:#f0883a}.lb.t{background:#2e6e6a}.lb.g{background:#6aae3a}.lb.b{background:#6a86c8}
.srow .vv{flex:1;background:#fff;border:1px solid #cfd6e2;border-radius:5px;padding:2px 8px;text-align:right;color:#1b2a45}
.bar2{position:relative;height:20px;border-radius:5px;overflow:hidden;background:#c9d2e0;flex:1;font:13px/20px 'Jua',sans-serif;color:#fff}
.bar2 i{position:absolute;left:0;top:0;bottom:0}
.bar2 span,.bar2 b{position:absolute;top:0;font-weight:400}
.bar2 span{left:8px}.bar2 b{right:8px}
.bar2.hp i{background:linear-gradient(#ff6b7a,#e0344a)}.bar2.mp i{background:linear-gradient(#5aaaf5,#2a6ad8)}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px;margin-bottom:8px}
.islot{aspect-ratio:1;border-radius:7px;background:linear-gradient(#f9fafc,#dfe4ed);border:2px solid var(--gc,#c3cbda);display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;padding:0;color:inherit}
.islot.sel{border-color:#f08a24;box-shadow:0 0 0 2px #f08a24}
.islot small{position:absolute;right:3px;bottom:0;font:11px 'Jua',sans-serif;color:#2a3550}
.idet{background:#fff;border:1px solid #cfd6e2;border-radius:8px;padding:8px;min-height:62px;margin-bottom:8px}
.idet b{font:15px 'Jua',sans-serif;font-weight:400}
.idet p{margin:3px 0 0;font-size:13px;color:#4a5670;line-height:1.4}
.idet .btnrow{margin-top:6px}
.money{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #cfd6e2;border-radius:8px;padding:4px 10px;font:15px 'Jua',sans-serif}
.money span{background:#d9a52a;color:#fff;border-radius:6px;padding:2px 10px}
.money b{flex:1;text-align:right;font-weight:400}
#boot{align-items:center;justify-content:center;text-align:center;background:linear-gradient(#8fd2ff,#dff4ff 55%,#a6dc7a 55.1%,#6cc24a);color:#3b2a1a;font:20px 'Jua',sans-serif}
.bootleaf{font-size:54px;animation:hop 1s ease-in-out infinite}
</style>
</head>
<body>
<!-- login restored -->
<div id="app">
  <section id="login" class="screen">
    <div class="lcard">
      <h1>🍁 단풍숲 모험</h1>
      <p class="sub">돌아다니고, 사냥하고, 던전에 도전하고, 친구를 만나요.</p>
      <label class="field"><span>아이디 (캐릭터 이름)</span><input id="inName" maxlength="10" autocomplete="username" placeholder="2~10자"></label>
      <label class="field"><span>비밀번호</span><input id="inPw" type="password" maxlength="40" autocomplete="current-password" placeholder="4자 이상"></label>
      <label class="chk"><input type="checkbox" id="inAuto" checked> 이 기기에서 자동 로그인</label>
      <div class="lrow"><button class="btn" id="btnLogin">로그인</button><button class="btn ghost" id="btnReg">새로 시작</button></div>
      <p id="loginMsg" role="alert"></p>
      <p class="mut" id="loginNote">계정과 진행 상황은 이 기기의 브라우저에 저장돼요. 다른 기기로 옮기려면 설정의 백업 코드를 사용하세요.</p>
    </div>
  </section>

  <section id="game" class="screen" hidden>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div class="hud">
        <div class="nm" id="hNm"></div>
        <div class="bar"><i id="hpF"></i><span id="hpT"></span></div>
      </div>
      <div id="mapName"></div>
      <div id="timer" hidden></div>
      <div id="bossHud" hidden><b id="bossNm"></b><div class="bar"><i id="bossF"></i></div></div>
      <div id="menuBtns">
        <button data-act="worldmap" aria-label="월드맵">🗺️</button>
        <button data-act="bag" aria-label="가방">🎒</button>
        <button data-act="quest" aria-label="퀘스트">📜<span class="badge" id="qBadge" hidden></span></button>
        <button data-act="friends" aria-label="친구">👥<span class="badge" id="fBadge" hidden></span></button>
        <button data-act="chat" aria-label="채팅">💬</button>
        <button data-act="settings" aria-label="설정">⚙️</button>
      </div>
      <div id="chatlog"></div>
      <div id="banner"></div>
      <div id="hint"></div>
      <div id="xpBar"><i id="xpF"></i></div>
    </div>
    <div id="chatbar" hidden>
      <input id="chatIn" maxlength="40" placeholder="친구에게 말하기" autocomplete="off">
      <button data-act="emote" data-e="👋">👋</button><button data-act="emote" data-e="😀">😀</button><button data-act="emote" data-e="❤️">❤️</button><button data-act="emote" data-e="👍">👍</button>
      <button data-act="send" class="btn sm">보내기</button>
    </div>
    <div id="pad">
      <div class="grp dpad">
        <div></div><button class="pb" data-k="up" id="bUp">↑<small>대화</small></button><div></div>
        <button class="pb" data-k="l">◀</button><button class="pb" data-k="d">▼</button><button class="pb" data-k="r">▶</button>
      </div>
      <div class="grp act">
        <button class="pb" data-k="s1" id="bS1"><span id="i1">💥</span><small id="n1"></small><i class="cd" id="cd1"></i></button>
        <button class="pb" data-k="s2" id="bS2"><span id="i2">🌀</span><small id="n2"></small><i class="cd" id="cd2"></i></button>
        <button class="pb big" data-k="jump" id="bJump">점프</button>
        <button class="pb big" data-k="atk" id="bAtk">공격</button>
      </div>
    </div>
  </section>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';

/* ================= 저장소 / 유틸 ================= */
const mem={};let storageOK=true;
function sget(k){try{return localStorage.getItem(k)}catch(e){storageOK=false;return mem[k]===undefined?null:mem[k]}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){storageOK=false;mem[k]=v}}
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];

function genItem(lv,slot,minR){
  slot=slot||pick(['w','a','c']);
  let ri=0,roll=Math.random()*100,acc=0;
  for(let i=0;i<RAR.length;i++){acc+=RAR[i][3];if(roll<acc){ri=i;break}}
  ri=Math.max(ri,minR||0);
  const m=RAR[ri][2],b=Math.max(1,lv);
  const tier=b<5?'낡은':b<10?'튼튼한':b<20?'강철':b<30?'은빛':'황금';
  const it={id:uid(),slot:slot,r:ri,lv:b,atk:0,def:0,hp:0,name:''};
  if(slot==='w'){it.atk=Math.round((b*2.6+4)*m*rnd(.9,1.1));it.name=tier+' '+JOBS[S.job].wname}
  else if(slot==='a'){it.def=Math.round((b*1.1+2)*m*rnd(.9,1.1));it.hp=Math.round(b*9*m);it.name=tier+' 갑옷'}
  else{it.atk=Math.round((b*.9+1)*m*rnd(.9,1.1));it.hp=Math.round(b*4*m);it.name=tier+' 목걸이'}
  return it;
}

let SERVER=null,lastPush='',pushBusy=false;
async function api(method,path,body,tok){
  const r=await withTimeout(fetch(path,{method:method,headers:Object.assign({'Content-Type':'application/json'},tok?{'X-Token':tok}:{}),body:body?JSON.stringify(body):undefined,keepalive:method==='PUT'&&JSON.stringify(body||'').length<60000}),8000);
  if(!r)throw new Error('timeout');
  let j={};try{j=await r.json()}catch(e){}
  return {ok:r.ok,status:r.status,j:j};
}
async function detectServer(){
  try{
    if(!/^https?:$/.test(location.protocol))return false;
    const r=await withTimeout(fetch('/api/ping',{cache:'no-store'}),4000);
    if(!r||!r.ok)return false;
    const j=await r.json();
    if(j&&j.ok&&j.v===1){SERVER={token:null};return true}
  }catch(e){}
  return false;
}
function pushServer(){
  if(!SERVER||!SERVER.token||!S||pushBusy)return;
  const js=JSON.stringify(S),cmp=JSON.stringify(Object.assign({},S,{lastSeen:0}));
  if(cmp===lastPush)return;
  pushBusy=true;
  api('PUT','/api/save',{save:js},SERVER.token).then(r=>{if(r.ok)lastPush=cmp;else if(r.status===401){SERVER.token=null;sset('dsa_tok','');toast('다시 로그인해 주세요')}}).catch(()=>{}).then(()=>{pushBusy=false});
}
function makeServerRoom(token){
  const peers=new Map();let ws=null,connected=false,pc=null,cc=null,closeCb=null,last=null,stopped=false,retry=0,timer=null;
  const mk=(id,p)=>({peer:id,presence:p,kind:'viewer',isMe:false});
  function connect(){
    if(stopped)return;
    try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?token='+encodeURIComponent(token))}catch(e){timer=setTimeout(connect,3000);return}
    ws.onopen=()=>{connected=true;retry=0;if(cc)cc(true);if(last)try{ws.send(JSON.stringify({t:'pres',p:last}))}catch(e){}};
    ws.onmessage=ev=>{
      let m;try{m=JSON.parse(ev.data)}catch(e){return}
      if(m.t==='hello'){
        peers.clear();const ups=[];
        (m.peers||[]).forEach(o=>{const p=mk(o.peer,o.presence);peers.set(o.peer,p);ups.push(p)});
        if(pc)pc({peers:[...peers.values()],joined:[],left:[],updated:ups});
      }else if(m.t==='pres'){
        const had=peers.get(m.peer);const p=mk(m.peer,m.p);peers.set(m.peer,p);

function getSprite(kind,pal){

      if(px>=18&&px<=19&&py>=7&&py<=9)ch='e';
      if(!edge(px,py)&&((px===6&&py===5)||(px===7&&py===4)||(px===8&&py===3)||(px===9&&py===3)||(px>=19&&px<=21&&py===3)||(px===22&&py===4)))ch='W';
    }else{

    npcs:def.npcs||[]};
  const rr=seeded(id.split('').reduce((a,ch2)=>a*31+ch2.charCodeAt(0),7)+13);
  const th=THEMES[def.theme];
  const kinds=th.cave?['stal','crystal','crystal','pillar']:def.theme==='sea'?['shell','rockS','starfish','shell']:def.theme==='mushforest'?['mushroom','bush','bush','flower','mushroom','rockS']:(def.theme==='spring'||def.theme==='meadow')?['bush','flower','flower','flower','bush','rockS']:['leaves','leaves','leaves','flower','rockS','bush'];
  for(let x=36;x<def.w-20;x+=rr()*90+60){g.deco.push({k:kinds[Math.floor(rr()*kinds.length)],x:x,s:.8+rr()*.6})}
  if(id==='town')g.deco=g.deco.filter(d=>Math.abs(d.x-150)>70&&Math.abs(d.x-330)>110&&Math.abs(d.x-640)>40);

function floatText(x,y,txt,col,size){G.texts.push({x:x,y:y,t:0,txt:txt,col:col||'#fff',size:size||14})}

function dealDamage(m,mult,o){
  o=o||{};
  if(m.dead)return;
  const crit=Math.random()<ST.crit;
  let dmg=ST.atk*mult*rnd(.9,1.12)*(crit?1.7:1);
  dmg=Math.max(1,Math.round(dmg));
  m.hp-=dmg;m.hurt=.18;
  if(!m.boss)m.kb=(o.dir||G.P.dir)*(o.kb||90);
  floatText(m.x+rnd(-8,8),m.y-m.def.h*(m.def.sc?1:1)-6,String(dmg),crit?'#ffd83a':'#fff',crit?20:15);
  burst(m.x,m.y-m.def.h/2,crit?'#ffd83a':'#fff',crit?7:4,90);
  if(m.hp<=0)killMob(m);
}
function hitBox(x,y,w,h,mult,maxT,o){
  let n=0;
  const list=G.mobs.filter(m=>!m.dead).sort((a,b)=>Math.abs(a.x-G.P.x)-Math.abs(b.x-G.P.x));
  for(const m of list){
    if(n>=maxT)break;
    const mx0=m.x-m.def.w/2,mx1=m.x+m.def.w/2,my0=m.y-m.def.h,my1=m.y;
    if(mx1>=x&&mx0<=x+w&&my1>=y&&my0<=y+h){dealDamage(m,mult,o);n++}

function qs(id){if(!S.q[id])S.q[id]={s:0,n:0};return S.q[id]}

function goMap(id,sx,silent){

/* ================= 업데이트 ================= */
function landing(P,prevY){
  for(const p of G.plats){
    if(P.x<p.x-4||P.x>p.x+p.w+4)continue;
    if(P.vy>=0&&prevY<=p.y+1&&P.y>=p.y&&(p.ground||P.dropT<=0)){P.y=p.y;P.vy=0;P.onGround=true;return}
  }
  P.onGround=false;
}
function update(dt){
  G.t+=dt;
  const P=G.P,def=G.def;
  if(G.fade>0)G.fade=Math.max(0,G.fade-dt*3);
  /* 입력 */
  const canAct=!P.dead&&!uiOpen;
  if(canAct){
    const mv=(K.r?1:0)-(K.l?1:0);
    if(P.dash>0){P.dash-=dt}
    else{
      const tv=mv*(S.job==='thief'?150:135);
      P.vx+=(tv-P.vx)*Math.min(1,dt*(P.onGround?14:6));
    }
    if(mv)P.dir=mv;
    P.walk=mv!==0&&P.onGround;
    if(K.jumpP){K.jumpP=false;
      if(K.d&&P.onGround&&P.y<GY-1){P.dropT=.28;P.y+=2;P.onGround=false}
      else if(P.onGround){P.vy=-480;P.onGround=false}
    }
    if(K.atk)playerAttack();
    if(K.s1&&!K.s1L){useSkill(0)}K.s1L=K.s1;
    if(K.s2&&!K.s2L){useSkill(1)}K.s2L=K.s2;
    if(K.upP){K.upP=false;interact()}
  }else{K.jumpP=K.upP=false;P.walk=false;if(!P.dead)P.vx*=.8}
  /* 물리 */
  const prevY=P.y;
  P.vy+=1400*dt;if(P.vy>800)P.vy=800;
  P.x+=P.vx*dt;P.y+=P.vy*dt;
  P.x=clamp(P.x,14,def.w-14);
  const eg=def.edges;
  if(eg&&!P.dead&&!uiOpen){
    if(P.x<=18&&K.l&&eg.l){goMap(eg.l.to,eg.l.tx);return}
    if(P.x>=def.w-18&&K.r&&eg.r){goMap(eg.r.to,eg.r.tx);return}
  }
  if(P.dropT>0)P.dropT-=dt;
  landing(P,prevY);
  if(P.atkT>0)P.atkT-=dt;
  if(P.atkAnim>0)P.atkAnim-=dt;
  if(P.inv>0)P.inv-=dt;
  P.cd[0]=Math.max(0,P.cd[0]-dt);P.cd[1]=Math.max(0,P.cd[1]-dt);
  if(P.sayT>0)P.sayT-=dt;
  /* 회복 */
  if(!P.dead){
    if(def.safe)P.hp=Math.min(ST.maxHp,P.hp+ST.maxHp*.12*dt);
    else if(G.t-P.lastDmgT>4)P.hp=Math.min(ST.maxHp,P.hp+ST.maxHp*.015*dt);
  }else{P.deadT-=dt;if(P.deadT<=0){respawn();return}}
  /* 몬스터 */
  if(!def.safe&&!def.dungeon)ensureSlots(dt);
  if(def.dungeon)updateDungeon(dt);
  const pl=P;
  for(const m of G.mobs){
    if(m.dead)continue;
    m.t+=dt;if(m.hurt>0)m.hurt-=dt;
    const d=m.def,dx=pl.x-m.x,near=Math.abs(pl.y-m.y)<50&&Math.abs(dx)<(m.boss?420:160)&&!pl.dead;
    let sp=d.spd;
    if(m.kb){m.x+=m.kb*dt;m.kb*=Math.pow(.02,dt);if(Math.abs(m.kb)<5)m.kb=0}
    else if(near){m.dir=dx>0?1:-1;sp*=m.boss?1.3:1.5;if(m.charge>0){sp*=2.2;m.charge-=dt}}
    else{
      if(m.pause>0){m.pause-=dt;sp=0}
      else if(Math.random()<dt*.25){m.pause=rnd(.6,1.6);m.dir=Math.random()<.5?-1:1}
    }
    if(!m.kb){
      const stop=near&&Math.abs(dx)<d.w*.4;
      if(!stop)m.x+=m.dir*sp*dt;
      if(m.x<m.host.x+12){m.x=m.host.x+12;if(!near)m.dir=1}
      if(m.x>m.host.x+m.host.w-12){m.x=m.host.x+m.host.w-12;if(!near)m.dir=-1}
    }
    m.x=clamp(m.x,m.host.x+12,m.host.x+m.host.w-12);
    if(m.boss){
      m.cdAtk-=dt;
      if(m.cdAtk<=0&&near){
        m.cdAtk=rnd(3.5,5);
        if(Math.random()<.5){m.charge=1.1}
        else G.mprojs.push({x:m.x,y:m.y-14,vx:(dx>0?1:-1)*230,w:34,h:28,dmg:d.atk*.8,life:2.4});
      }
    }
    /* 접촉 */
    if(!pl.dead&&Math.abs(pl.x-m.x)<(d.w/2+9)&&pl.y>m.y-d.h&&pl.y-34<m.y){hurtPlayer(d.atk,m.x)}
  }
  G.mobs=G.mobs.filter(m=>!m.dead||m.t<9999&&false);
  /* 보스 HUD */
  const bossM=G.mobs.find(m=>m.boss&&!m.dead);
  $('#bossHud').hidden=!bossM;
  if(bossM){$('#bossNm').textContent=bossM.def.n;$('#bossF').style.width=Math.max(0,bossM.hp/bossM.max*100)+'%'}
  /* 몬스터 투사체 */
  G.mprojs.forEach(p=>{p.x+=p.vx*dt;p.life-=dt;
    if(!pl.dead&&Math.abs(pl.x-p.x)<p.w/2+9&&pl.y>p.y-p.h-6&&pl.y-34<p.y+6){hurtPlayer(p.dmg,p.x);p.life=0}});
  G.mprojs=G.mprojs.filter(p=>p.life>0&&p.x>0&&p.x<def.w);
  /* 플레이어 투사체 */
  for(const p of G.projs){
    p.x+=p.vx*dt;if(p.vy)p.y+=p.vy*dt;p.life-=dt;
    if(p.fall&&p.y>=GY)p.life=0;
    for(const m of G.mobs){
      if(m.dead||p.life<=0)continue;
      if(p.hit&&p.hit.has(m))continue;
      if(Math.abs(p.x-m.x)<m.def.w/2+6&&p.y>m.y-m.def.h-4&&p.y<m.y+6){
        (p.hit=p.hit||new Set()).add(m);
        if(p.aoe){
          G.effs.push({k:'boom',x:p.x,y:p.y,t:0,life:.3,r:p.aoe});
          G.mobs.forEach(o=>{if(!o.dead&&Math.abs(o.x-p.x)<p.aoe&&Math.abs((o.y-o.def.h/2)-p.y)<p.aoe)dealDamage(o,p.mult,{dir:p.dir,kb:130})});
          p.life=0;
        }else{
          dealDamage(m,p.mult,{dir:p.dir});
          p.pierce--;if(p.pierce<=0)p.life=0;
        }
      }
    }
  }
  G.projs=G.projs.filter(p=>p.life>0&&p.x>0&&p.x<def.w);
  /* 드랍 */
  for(const d of G.drops){
    d.age+=dt;d.vy+=900*dt;d.y+=d.vy*dt;
    let gy=GY;for(const p of G.plats){if(d.x>=p.x&&d.x<=p.x+p.w&&p.y>=d.y-12&&p.y<gy)gy=p.y}
    if(d.y>=gy-6){d.y=gy-6;d.vy=-Math.abs(d.vy)*.35;if(Math.abs(d.vy)<40)d.vy=0}
    if(d.age>.5&&!pl.dead&&Math.abs(pl.x-d.x)<30&&Math.abs((pl.y-16)-d.y)<40){pickup(d)}
    if(d.age>90)d.gone=true;
  }
  G.drops=G.drops.filter(d=>!d.gone);
  /* 이펙트 */
  G.effs.forEach(e=>e.t+=dt);G.effs=G.effs.filter(e=>e.t<e.life);
  G.parts.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt});G.parts=G.parts.filter(p=>p.t<p.life);
  G.texts.forEach(t=>t.t+=dt);G.texts=G.texts.filter(t=>t.t<1);
  /* 원격 플레이어 보간 */
  const seen=new Set();
  for(const p of others()){
    const pr=p.presence;
    if(pr.m!==mapKey())continue;
    seen.add(p.peer);
    let r=rem.get(p.peer);
    const tx=clamp(Number(pr.x)||0,0,def.w),ty=clamp(Number(pr.y)||GY,0,MH+50);
    if(!r){r={x:tx,y:ty,k:Number(pr.k)||0,atk:0,say:'',sayT:0};rem.set(p.peer,r)}
    r.x+=(tx-r.x)*Math.min(1,dt*12);r.y+=(ty-r.y)*Math.min(1,dt*12);
    r.dir=pr.d===-1?-1:1;r.walk=Math.abs(tx-r.x)>2;r.air=pr.a===1;
    r.job=JOBS[pr.j]?pr.j:'warrior';r.wid=WEAPONS[pr.wp]?pr.wp:null;r.hair=/^#[0-9a-f]{6}$/i.test(pr.h)?pr.h:'#7a4b2a';r.lv=clamp(Number(pr.l)||1,1,LVMAX);r.name=clean(pr.n,12);r.dead=pr.dd===1;
    const kk=Number(pr.k)||0;if(kk!==r.k){r.k=kk;r.atkA=.22}
    if(r.atkA>0)r.atkA-=dt;if(r.sayT>0)r.sayT-=dt;
  }
  for(const k of Array.from(rem.keys()))if(!seen.has(k))rem.delete(k);
  /* 프레즌스 */
  presTimer-=dt;if(presTimer<=0){presTimer=.1;sendPres(false)}
}
function pickup(d){
  if(d.t==='meso'){S.mesos+=d.amt;floatText(G.P.x,G.P.y-54,'+'+d.amt,'#ffe27a',13);d.gone=true}

    if(S.bag.length>=30){if(!pickup.warn||G.t-pickup.warn>3){toast('가방이 가득 찼어요');pickup.warn=G.t}return}

  }
}

const wrap=(v,m)=>((v%m)+m)%m;

function tri(u){u=u-Math.floor(u);return 1-Math.abs(2*u-1)}
function hillY(wx,base,amp,per){return base-Math.abs(Math.sin(wx/per))*amp-Math.sin(wx/(per*2.3))*amp*.5}

  if(Math.abs(G.P.x-n.x)<46){c.fillStyle='#fff';c.fillText('↑ 대화',0,n.id==='shop'?36:-80)}

function nameTag(x,y,name,lv,col){

  const txt='Lv'+lv+' '+name,w=c.measureText(txt).width+10;
  c.fillStyle='rgba(0,0,0,.55)';c.fillRect(x-w/2,y,w,14);c.fillStyle=col||'#fff';c.fillText(txt,x,y+11);
}
function bubble(x,y,text){
  c.font='12px "Gowun Dodum", sans-serif';c.textAlign='center';
  const w=Math.min(150,c.measureText(text).width+14);
  c.fillStyle='rgba(255,255,255,.95)';c.strokeStyle='rgba(0,0,0,.4)';c.lineWidth=1;
  c.beginPath();c.roundRect?c.roundRect(x-w/2,y-18,w,20,8):c.rect(x-w/2,y-18,w,20);c.fill();c.stroke();
  c.fillStyle='#222';c.fillText(text.length>16?text.slice(0,16)+'…':text,x,y-4);
}
function render(){
  const P=G.P,def=G.def;
  c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle=THEMES[def.theme].sky[0];c.fillRect(0,0,cw,ch);
  c.setTransform(dpr*sc,0,0,dpr*sc,0,0);
  let ox=0;
  if(def.w<viewW)ox=(viewW-def.w)/2;
  const camX=def.w<viewW?0:clamp(P.x-viewW/2,0,def.w-viewW);
  G.camX=camX;
  c.save();c.translate(ox,offY);
  c.beginPath();c.rect(0,-offY-10,Math.min(viewW,def.w),MH+offY+10);c.clip();
  c.save();c.translate(-camX,0);
  /* 배경은 화면 기준 */
  c.restore();
  drawBG(camX);drawLeaves();
  c.save();c.translate(-camX,0);
  drawDeco(camX);
  drawPlats(camX);
  drawEdges();
  G.npcs.forEach(drawNpc);
  /* 드랍 */
  for(const d of G.drops){
    const bob=Math.sin(G.t*5+d.x)*1.5;
    if(d.t==='meso'){c.imageSmoothingEnabled=false;c.drawImage(COIN,Math.round(d.x-6),Math.round(d.y-6.5+bob),12,13)}
    else{const col=RAR[d.item.r][1];rect(d.x-8,d.y-10+bob,16,16,col);rect(d.x-6,d.y-8+bob,12,12,'rgba(0,0,0,.45)');c.fillStyle='#fff';c.font='11px sans-serif';c.textAlign='center';c.fillText(d.item.slot==='w'?'⚔':d.item.slot==='a'?'🛡':'◎',d.x,d.y+1+bob)}
  }
  /* 몬스터 */
  for(const m of G.mobs){
    drawMob(m,G.t);
    if(m.hp<m.max&&!m.boss){const w=m.def.w;rect(m.x-w/2,m.y-m.def.h-8,w,4,'rgba(0,0,0,.6)');rect(m.x-w/2,m.y-m.def.h-8,w*Math.max(0,m.hp/m.max),4,'#7be06a')}
  }
  /* 원격 */
  for(const r of rem.values()){
    drawChar(r.x,r.y,r.dir,G.t,{job:r.job,hair:r.hair,wid:r.wid,lv:r.lv,walk:r.walk,air:r.air,dead:r.dead,atk:r.atkA>0?1-r.atkA/.22:0});
    nameTag(r.x,r.y+3,r.name,r.lv,'#9fe8ff');
    if(r.sayT>0&&r.say)bubble(r.x,r.y-64,r.say);
  }
  /* 나 */
  c.save();
  if(P.inv>0&&Math.floor(G.t*14)%2===0)c.globalAlpha=.4;
  drawChar(P.x,P.y,P.dir,G.t,{job:S.job,hair:S.hair,wid:S.eq.w?S.eq.w.w:null,lv:S.level,walk:P.walk,air:!P.onGround,dead:P.dead,atk:P.atkAnim>0?1-P.atkAnim/.22:0});
  c.restore();
  nameTag(P.x,P.y+3,S.name,S.level,'#ffe27a');
  if(P.sayT>0&&P.say)bubble(P.x,P.y-64,P.say);
  /* 투사체 */
  for(const p of G.projs){
    if(p.k==='arrow'){c.save();c.translate(p.x,p.y);c.rotate(Math.atan2(p.vy||0,p.vx||1));rect(-9,-1,16,2,'#e8d8b0');rect(6,-2.5,4,5,'#cfd6e4');rect(-10,-2,4,4,'#c0392b');c.restore()}
    else if(p.k==='bolt'){ell(p.x,p.y,7,7,'rgba(122,215,255,.5)');ell(p.x,p.y,4,4,'#d6f4ff')}
    else if(p.k==='fire'){ell(p.x,p.y,11,11,'rgba(255,140,40,.45)');ell(p.x,p.y,7,7,'#ff9a3a');ell(p.x,p.y,3.5,3.5,'#ffe27a')}
    else{c.save();c.translate(p.x,p.y);c.rotate(G.t*20);rect(-5,-1,10,2,'#e8e8f0');rect(-1,-5,2,10,'#e8e8f0');c.restore()}
  }
  for(const p of G.mprojs){ell(p.x,p.y-p.h/2,p.w/2,p.h/2,'rgba(200,80,255,.65)');ell(p.x,p.y-p.h/2,p.w/3,p.h/3,'#f0c8ff')}
  /* 이펙트 */
  for(const e of G.effs){
    const a=1-e.t/e.life;
    c.save();c.globalAlpha=a;
    if(e.k==='slash'){c.translate(e.x,e.y);c.scale(e.dir,1);c.strokeStyle=e.col||'#fff';c.lineWidth=5;c.beginPath();c.arc(-e.r*.4,0,e.r,-1.1,1.1);c.stroke()}
    else if(e.k==='ring'||e.k==='boom'){c.strokeStyle=e.col||'#ffb050';c.lineWidth=4;c.beginPath();c.arc(e.x,e.y,e.r*(1-a*.4)+4,0,6.28);c.stroke();if(e.k==='boom'){ell(e.x,e.y,e.r*(.5+(1-a)*.5),e.r*(.5+(1-a)*.5),'rgba(255,160,60,.4)')}}
    c.restore();
  }
  for(const p of G.parts){c.globalAlpha=1-p.t/p.life;rect(p.x,p.y,p.s,p.s,p.col)}
  c.globalAlpha=1;
  for(const t of G.texts){c.globalAlpha=1-t.t*t.t;c.font=t.size+'px Jua, sans-serif';c.textAlign='center';c.lineWidth=3;c.strokeStyle='#4a2a00';c.strokeText(t.txt,t.x,t.y-t.t*34);c.fillStyle=t.col;c.fillText(t.txt,t.x,t.y-t.t*34)}
  c.globalAlpha=1;
  c.restore();
  c.restore();
  /* 페이드 */
  if(G.fade>0){c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='rgba(0,0,0,'+G.fade+')';c.fillRect(0,0,cw,ch)}
}

  showModal(`<h2>던전 클리어!</h2><p>${esc(MAPS[id].name)}을(를) 정복했어요. 바닥에 떨어진 메소를 주워 가세요.</p>
  <div class="btnrow"><button class="btn good" data-act="close">메소 줍기</button><button class="btn ghost" data-act="leave">마을로 돌아가기</button></div>`);
}

/* ================= 행동 ================= */
function act(a,d,el){
  switch(a){
    case 'bag':case 'quest':case 'friends':case 'settings':openModal(a);break;
    case 'invsel':invSel=d.id;refreshModal();break;
    case 'worldmap':openModal('worldmap');break;
    case 'travel':closeModal();goMap(d.to,d.to==='town'?420:60);break;
    case 'enterdg':closeModal();goMap(d.to,60);break;
    case 'leave':closeModal();goMap('town',150);break;
    case 'close':closeModal();break;
    case 'chat':toggleChat();break;
    case 'send':doSend();break;
    case 'emote':say(d.e);break;
    case 'equip':{
      const i=S.bag.findIndex(x=>x.id===d.id);if(i<0)break;
      const it=S.bag.splice(i,1)[0],old=S.eq.w;
      S.eq.w=it;if(old)S.bag.push(old);
      ST=calcStats();G.P.hp=Math.min(G.P.hp,ST.maxHp);G.P.mp=Math.min(G.P.mp,ST.maxMp);refreshModal();save();break}
    case 'unequip':{
      const it=S.eq.w;if(!it)break;
      if(S.bag.length>=30){toast('가방이 가득 찼어요');break}
      S.bag.push(it);S.eq.w=null;ST=calcStats();G.P.hp=Math.min(G.P.hp,ST.maxHp);G.P.mp=Math.min(G.P.mp,ST.maxMp);refreshModal();save();break}
    case 'sellitem':{
      const i=S.bag.findIndex(x=>x.id===d.id);if(i<0)break;
      const it=S.bag.splice(i,1)[0];S.mesos+=itemPrice(it);toast('메소 '+itemPrice(it)+' 획득');refreshModal();save();break}
    case 'buyw':{
      const W=WEAPONS[d.w];if(!W)break;
      if(S.mesos<W.price){toast('메소가 부족해요');break}
      const old=S.eq.w;
      if(old&&S.bag.length>=30){toast('가방이 가득 찼어요');break}
      S.mesos-=W.price;
      S.eq.w={id:uid(),slot:'w',w:d.w,r:0,name:W.n};
      if(old)S.bag.push(old);
      ST=calcStats();G.P.mp=Math.min(G.P.mp,ST.maxMp);toast(W.n+' 구매하고 장착했어요!');refreshModal();save();break}
    case 'qaccept':{const st=qs(d.id);st.s=1;st.n=0;refreshModal();updateQuestBadge();break}
    case 'qclaim':{
      const q=QUESTS.find(x=>x.id===d.id),st=qs(d.id);if(!q||st.s!==2)break;
      st.s=3;S.mesos+=q.meso;gainExp(q.exp);toast('보상을 받았어요!');refreshModal();updateQuestBadge();save();break}
    case 'logout':logout();break;
    case 'save':save();toast('저장했어요');break;
    case 'export':{save();const b=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#codeBox').value=b;$('#codeBox').select();break}
    case 'copy':{
      const b=$('#codeBox');if(!b.value){toast('먼저 코드를 만들어 주세요');break}
      b.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
      if(!ok&&navigator.clipboard){navigator.clipboard.writeText(b.value).then(()=>toast('복사했어요'),()=>toast('직접 선택해서 복사해 주세요'));break}
      toast(ok?'복사했어요':'직접 선택해서 복사해 주세요');break}
    case 'import':{
      const v=($('#codeBox').value||'').trim();
      if(!v){toast('백업 코드를 붙여넣어 주세요');break}
      if(confirmKey!=='import'){keepCode(()=>setConfirm('import'));break}
      try{
        const o=JSON.parse(decodeURIComponent(escape(atob(v))));
        if(typeof o.level!=='number')throw 0;
        S=mergeSave(o,S.name);confirmKey=null;save();closeModal();
        ST=calcStats();goMap(S.map,300,true);G.P.hp=ST.maxHp;G.P.mp=ST.maxMp;updateQuestBadge();toast('불러오기 완료');
      }catch(e){confirmKey=null;toast('올바르지 않은 백업 코드예요')}
      break}
    case 'wipe':
      if(confirmKey!=='wipe'){setConfirm('wipe');break}
      {const n=S.name;confirmKey=null;S=newChar(n,S.job,S.hair);save();closeModal();ST=calcStats();goMap('town',400,true);G.P.hp=ST.maxHp;G.P.mp=ST.maxMp;updateQuestBadge();toast('처음부터 시작해요')}
      break;
    case 'install':
      if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;refreshModal()})}
      break;
  }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||!S)return;
  act(b.dataset.act,b.dataset,b);
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&modalName)closeModal()});

/* ================= 메인 루프 ================= */
let lastF=0,hudT=0;
function frame(ts){
  raf=requestAnimationFrame(frame);
  if(!S||!G)return;
  if(!lastF)lastF=ts;
  let dt=(ts-lastF)/1000;lastF=ts;
  if(dt>.1)dt=.1;
  try{
    update(dt);
    if(!G)return;
    render();
    hudT-=dt;if(hudT<=0){hudT=.08;updateHud()}
  }catch(err){console.error(err)}
}
function startGame(){
  ST=calcStats();
  G=null;
  clearKeys();
  resize();
  goMap(S.map||'town',S.map&&S.map!=='town'?80:420,true);
  G.P.hp=ST.maxHp;G.P.mp=ST.maxMp;
  $('#chatlog').innerHTML='';
  updateQuestBadge();updateFriendBadge();
  $('#hint').textContent='← → 이동   화면 끝까지 걸으면 다음 지역으로';
  setTimeout(()=>{$('#hint').textContent=''},7000);
  document.title=S.name+' - 단풍숲 모험';
  if(S.migrated){const g=S.migrated;delete S.migrated;setTimeout(()=>toast('기존 장비는 메소 '+fmt(g)+'로 바꿔 드렸어요'),1200)}
  clearInterval(saveTimer);saveTimer=setInterval(save,10000);
  lastF=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);
  connectRoom();
}
function stopGame(){
  clearInterval(saveTimer);cancelAnimationFrame(raf);
  if(R){try{R.presence({m:null,n:null,s:null})}catch(e){}if(R.close){try{R.close()}catch(e){}R=null}}
  G=null;rem.clear();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.addEventListener('pagehide',save);

/* ================= 로그인 UI / PWA / 부팅 ================= */
(function pwa(){
  try{
    const cv2=document.createElement('canvas');
    const icon=sz=>{cv2.width=cv2.height=sz;const x=cv2.getContext('2d');x.fillStyle='#f08a24';x.fillRect(0,0,sz,sz);x.fillStyle='#fff3d6';x.beginPath();x.arc(sz/2,sz/2,sz*.38,0,7);x.fill();x.font=(sz*.5)+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🍁',sz/2,sz/2+sz*.03);return cv2.toDataURL('image/png')};
    const i192=icon(192),i512=icon(512);
    const l=document.createElement('link');l.rel='apple-touch-icon';l.href=i192;document.head.appendChild(l);
    const base=location.href.split('#')[0];
    const man={name:'단풍숲 모험',short_name:'단풍숲',start_url:base,scope:base,display:'standalone',orientation:'landscape',background_color:'#fdf3dc',theme_color:'#f08a24',lang:'ko',icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png'}]};
    const ml=document.createElement('link');ml.rel='manifest';ml.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.appendChild(ml);
  }catch(e){}
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(modalName==='settings')refreshModal()});
})();
$('#btnLogin').addEventListener('click',doLogin);
$('#btnReg').addEventListener('click',doRegister);
$('#inPw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
$('#inName').addEventListener('keydown',e=>{if(e.key==='Enter')$('#inPw').focus()});
(async function boot(){
  const last=sget('dsa_last');
  if(last)$('#inName').value=last;
  const hasSrv=await detectServer();
  if(hasSrv){
    const tok=sget('dsa_tok');
    if(tok&&sget('dsa_auto')==='1'){
      try{
        const r=await api('GET','/api/me',null,tok);
        if(r.ok){
          SERVER.token=tok;
          let raw=null;try{raw=r.j.save?JSON.parse(r.j.save):null}catch(e){}
          if(raw){enter(r.j.name,true,raw);return}
          createChar(r.j.name,true);return;
        }
      }catch(e){}
    }
    $('#loginNote').textContent='계정과 진행 상황은 서버에 저장돼요. 어느 기기에서든 같은 아이디로 이어서 할 수 있어요.';
    return;
  }
  if(sget('dsa_auto')==='1'&&last&&getAcc()[last]&&sget(saveKey(last)))enter(last,true);
})();
window.__dbg=function(){return {S:S,G:G,ST:ST,goMap:goMap,getSprite:getSprite,preview:function(wid,aa){const cv2=document.createElement('canvas');cv2.width=170;cv2.height=130;const g=cv2.getContext('2d');g.fillStyle='#bfe3ff';g.fillRect(0,0,170,130);const old=c;c=g;try{g.translate(70,110);g.scale(3,3);drawChar(0,0,1,1,{job:'warrior',hair:'#2e8b57',wid:wid,atk:aa})}finally{c=old}return cv2.toDataURL()}}};
})();
